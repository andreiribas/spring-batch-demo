spring:
  application:
    name: spring-batch-demo

  datasource:
    url: jdbc:h2:mem:batchdemo;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true # browser console at /h2-console, connects to THIS app's live in-memory DB
                     # (an external tool connecting to the same jdbc:h2:mem URL gets its own,
                     # separate, empty in-memory DB - in-memory H2 is only shared within one JVM)

  sql:
    init:
      mode: always # run these schema scripts on every startup (fresh in-memory DB each time)
      schema-locations:
        - classpath:schema.sql
        - classpath:org/springframework/batch/core/schema-h2.sql # Spring Batch's own BATCH_* metadata tables

  batch:
    job:
      enabled: false # don't auto-run on startup; trigger via POST /jobs/import instead

  threads:
    virtual:
      enabled: true # use virtual threads (Project Loom) wherever Spring Boot hands out an Executor

logging:
  level:
    com.example.batchdemo: DEBUG
    org.springframework.batch: INFO
